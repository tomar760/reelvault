<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Activity · ReelVault</title>
  <meta name="description" content="Retry queue and the full activity timeline — nothing ever gets silently lost."/>
  <meta name="theme-color" content="#0c0714"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <script>document.documentElement.dataset.theme = localStorage.getItem("rv_theme") || "dark";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body data-bg="rings">
  <canvas id="rv-bg"></canvas>
  <div class="bg-tint"></div>

  <main class="page">
    <div class="page-head">
      <h1>Activity</h1>
      <p>Failed downloads never disappear — they wait here for a retry</p>
    </div>

    <!-- M10: FAILED & RETRY QUEUE -->
    <section class="mod glass" style="margin-bottom:16px">
      <div class="mod-h"><h3>! Failed &amp; Retry Queue</h3><span class="tag">M10</span></div>
      <div id="queue-body"></div>
    </section>

    <!-- M13: FULL TIMELINE -->
    <section class="mod glass">
      <div class="mod-h">
        <h3>↻ Activity Timeline</h3>
        <div style="display:flex;gap:9px;align-items:center">
          <span class="muted" id="act-count">—</span>
          <select id="af-type" class="btn-mini" style="border:1.5px solid var(--line);background:rgba(127,140,160,.10);color:var(--text);border-radius:9px;padding:6px 10px">
            <option value="">All events</option>
            <option value="added">Added</option>
            <option value="retry">Retries</option>
            <option value="duplicate">Duplicates</option>
            <option value="failed">Failed</option>
            <option value="export">Exports</option>
            <option value="edit">Edits</option>
          </select>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <p class="page-footer">ReelVault Activity · demo data</p>
  </main>

  <script src="js/vendor/xlsx-style.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/activity.js"></script>
  <script>
    RVUI.init("activity");
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
